  <span class="desc_title">color 맵</span>
  <p class="desc_sub">
    각 지역마다 값을 가지는 데이터를 넣은 뒤, <b>map.colorAxis</b> 속성을 사용해 데이터 크기에 따라 색상이 변하는 맵 차트를 만들 수 있습니다.<br>
    이렇게 만든 맵에서 <b>legend</b> 속성을 사용해 범례를 표시할 수 있습니다.<br>
    예제에 사용된 데이터는 행정안전부 행정동별 주민등록 인구 및 세대현황(2024년 1월 기준) 를 이용했습니다.
  </p>
