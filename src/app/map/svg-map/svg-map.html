<div>
  <span class="desc_title">SVG 디자인 맵</span>
  <p class="desc_sub">
    <b>SVG 이미지</b>와 <b>json</b> 또는 <b>geojson</b>을 사용하여 맵을 구현할 수 있습니다.<br/>
    id가 일치하는 SVG 요소에 데이터가 맵핑 됩니다.
  </p>

  <div class='ibsheet-wrap' id='descFunc'>
    <div class="map_country">
      <input class='mgr5' type='radio' id='map1' name='map' value='0' checked>
      <label style='cursor: pointer' for='map1' class='mgr10'>서울지도</label>
      <input class='mgr5' type='radio' id='map2' name='map' value='1'>
      <label style='cursor: pointer' for='map2' class='mgr10'>대한민국지도</label>
      <input class='mgr5' type='radio' id='map3' name='map' value='2'>
      <label style='cursor: pointer' for='map3' class='mgr10'>세계지도</label>
    </div>
    <div class="map_type">
      <input class='mgr5' type='radio' id='type1' name='type' value='0' checked>
      <label style='cursor: pointer' for='type1' class='mgr10'>Type 1</label>
      <input class='mgr5' type='radio' id='type2' name='type' value='1'>
      <label style='cursor: pointer' for='type2' class='mgr10'>Type 2</label>
      <input class='mgr5' type='radio' id='type3' name='type' value='2'>
      <label style='cursor: pointer' for='type3' class='mgr10'>Type 3</label>
    </div>
  </div>

  <div id="mapDiv" style="width:100%; height:600px;"></div>
</div>
