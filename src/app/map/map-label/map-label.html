<div>
  <span class="desc_title">맵 - 레이블</span>
  <p class="desc_sub">
    <b>map.show("label")</b> 을 이용해 지역에 레이블을 표시할 수 있습니다.<br>이때 표시하는 레이블은 <b>map.key.name</b> 에 설정한 키를 geojson 데이터에서 읽어드립니다.<br>
    geojson 에 있는 다른 값으로 레이블을 표시하고자 한다면 <b>map.locale</b>을 이용해 <b>map.key.name-map.locale</b> 키에 해당하는 값을 읽어드리도록 할 수 있습니다.
  </p>
